[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-ai-assistant"
version = "0.1.0"
description = "Production-ready standalone AI assistant and digital twin of Alemu Kibret Mulugeta"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Alemu Kibret Mulugeta", email = "alemu.kibret@example.com" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "pgvector>=0.3.4",
    "alembic>=1.13.3",
    "redis[hiredis]>=5.1.0",
    "httpx>=0.27.2",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "structlog>=24.4.0",
    "python-dotenv>=1.0.1",
    "email-validator>=2.2.0",
    "python-multipart>=0.0.9",
    "aiosqlite>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "black>=24.8.0",
    "isort>=5.13.2",
    "mypy>=1.11.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --asyncio-mode=auto"
testpaths = ["tests"]
pythonpath = ["apps/backend", "packages/shared", "packages/database"]

[tool.black]
line-length = 88
target-version = ['py313']

[tool.isort]
profile = "black"
line_length = 88

[tool.vercel]
entrypoint = "apps.backend.app.main:app"

[tool.uv]
package = false

[tool.setuptools]
packages = ["apps", "packages", "api"]


