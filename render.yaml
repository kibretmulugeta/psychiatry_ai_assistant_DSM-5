# Render Infrastructure-as-Code Deployment Blueprint
# Project: DSM-5 Psychiatry & Clinical Psychology AI Assistant

services:
  # 1. FastAPI Backend Service
  - type: web
    name: psychiatry-dsm5-backend
    env: python
    region: oregon
    plan: starter
    buildCommand: "pip install -r requirements.txt && python scripts/ingest_knowledge_base.py"
    startCommand: "uvicorn apps.backend.app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/v1/health/liveness
    envVars:
      - key: PYTHONPATH
        value: "."
      - key: PYTHON_VERSION
        value: "3.13.0"
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: psychiatry-dsm5-db
          property: connectionString
      - key: ACTIVE_LLM_PROVIDER
        value: groq
      - key: ACTIVE_EMBEDDING_PROVIDER
        value: openai

databases:
  # 2. PostgreSQL Database with pgvector extension support
  - name: psychiatry-dsm5-db
    databaseName: dsm5_psychiatry
    user: postgres
    region: oregon
    plan: starter
    postgresMajorVersion: "16"
